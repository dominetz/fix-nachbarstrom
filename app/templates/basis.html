<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titel %}{{ marke }}{% endblock %}</title>
<style>
:root{--gruen:#57b33e;--text:#1d2a1a;--grau:#6b7568;--linie:#e3e8e1;--hell:#f5f8f4}
*{box-sizing:border-box}body{margin:0;font-family:Rubik,system-ui,sans-serif;color:var(--text);background:#fff;line-height:1.5}
header{background:var(--gruen);color:#fff;padding:12px 16px}header a{color:#fff;text-decoration:none;font-weight:600}
nav a{color:#fff;margin-left:16px;font-weight:400}
main{max-width:960px;margin:0 auto;padding:24px 16px}
h1{font-size:1.6rem;margin:.2em 0 .6em}h2{font-size:1.2rem;margin-top:1.6em}
table{width:100%;border-collapse:collapse;margin:8px 0}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--linie);vertical-align:top}
th{background:var(--hell);font-weight:600}
label{display:block;margin:10px 0 2px;font-weight:500}input,select,textarea{width:100%;padding:8px;border:1px solid #c9d1c6;border-radius:6px;font:inherit}
input[type=checkbox]{width:auto}button,.knopf{background:var(--gruen);color:#fff;border:0;border-radius:6px;padding:9px 16px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
.zweit{background:#fff;color:var(--gruen);border:1px solid var(--gruen)}
.hinweis{background:var(--hell);border-left:4px solid var(--gruen);padding:10px 14px;margin:12px 0}
.fehler{background:#fdeeee;border-left:4px solid #c0392b;padding:10px 14px}
.klein{color:var(--grau);font-size:.9rem}.raster{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.karte{border:1px solid var(--linie);border-radius:8px;padding:14px}
code{background:var(--hell);padding:1px 4px;border-radius:4px;word-break:break-all}
@media print{header,nav,.nicht-drucken{display:none}main{max-width:none}}
</style>
</head>
<body>
<header><a href="/">{{ marke }}</a>{% block nav %}{% endblock %}</header>
<main>{% block inhalt %}{% endblock %}</main>
</body>
</html>
